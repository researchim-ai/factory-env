schema_version: 1
factory:
  name: flow_demo
  time_unit: minute
machines:
  - id: M1
    capacity: 1
  - id: M2
    capacity: 1
jobs:
  - id: J1
    release_time: 0
    due_date: 20
    priority: 1
    operations:
      - id: J1-O1
        machine_id: M1
        duration: 3
      - id: J1-O2
        machine_id: M2
        duration: 2
  - id: J2
    release_time: 0
    due_date: 20
    priority: 1
    operations:
      - id: J2-O1
        machine_id: M1
        duration: 1
      - id: J2-O2
        machine_id: M2
        duration: 4
environment:
  id: FactoryRL/FlowShop-v0
  reward: negative_elapsed_time
  invalid_action_mode: raise
  allow_voluntary_idle: false
