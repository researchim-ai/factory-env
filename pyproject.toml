[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoryrl"
version = "0.1.0"
description = "Deterministic discrete-event factory simulator and Gymnasium environments for scheduling agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "FactoryRL contributors" }]
keywords = ["simulation", "job-shop", "reinforcement-learning", "gymnasium", "scheduling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3", "sb3-contrib>=2.3"]
solver = ["ortools>=9.10"]
plot = ["matplotlib>=3.8"]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
factoryrl = "factoryrl.cli:main"

[project.urls]
Documentation = "https://github.com/factoryrl/factoryrl"
Source = "https://github.com/factoryrl/factoryrl"

[tool.hatch.build.targets.wheel]
packages = ["src/factoryrl"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
packages = ["src/factoryrl"]

[tool.hatch.build.targets.sdist.sources]
"src" = ""

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"examples/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: longer smoke benchmarks",
]
filterwarnings = [
    "error",
    "ignore:Overriding environment:UserWarning",
    "ignore:`check_env\\(warn=`:UserWarning",
    "ignore:.*Not able to test alternative render modes.*:UserWarning",
    "ignore:.*Overriding environment.*:UserWarning",
    "ignore:The NumPy module was reloaded:UserWarning",
]

[tool.mypy]
python_version = "3.11"
packages = ["factoryrl"]
mypy_path = "src"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["gymnasium.*", "yaml.*", "ortools.*", "stable_baselines3.*", "sb3_contrib.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["factoryrl"]

[tool.coverage.report]
show_missing = true
skip_empty = true
